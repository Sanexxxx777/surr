<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d8ccb8">
  <title>Ачивки Настольного Сюрра</title>
  <meta name="description" content="Личный планшет настольщика: партии, ступени и отметки фестивалей. Демо для «Настольного Сюрра».">
  <link rel="icon" href="./art/D3.webp" type="image/webp">
  <!-- the plate for this viewport only (view.ts: portrait = narrower than tall and under 900 px); the spec json rides along with the script -->
  <link rel="preload" href="./plate/desk.json" as="fetch" crossorigin media="(orientation: landscape), (min-width: 900px)">
  <link rel="preload" href="./plate/desk.webp" as="image" type="image/webp" media="(orientation: landscape), (min-width: 900px)">
  <link rel="preload" href="./plate/phone.json" as="fetch" crossorigin media="(orientation: portrait) and (max-width: 899px)">
  <link rel="preload" href="./plate/phone.webp" as="image" type="image/webp" media="(orientation: portrait) and (max-width: 899px)">
  <link rel="preload" href="./fonts/AlegreyaSans-700-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/AlegreyaSans-800-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/Alegreya-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./fonts/fonts.css">
  <style>#boot{z-index:5;color:#2b2c28;background:#e6dccb;place-content:center;justify-items:center;gap:16px;font:700 18px Alegreya Sans,system-ui,sans-serif;display:grid;position:fixed;inset:0}#boot i{background:#bcd043;border-radius:5px;width:26px;height:26px;animation:.7s cubic-bezier(.3,0,.7,1) infinite alternate boot-hop;box-shadow:0 4px #8fa425}@keyframes boot-hop{to{transform:translateY(-18px)rotate(90deg)}}@media (prefers-reduced-motion:reduce){#boot i{animation:none}}</style>
  <script type="module" crossorigin src="./assets/main-BzMzYVto.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/art-l7XSff58.js">
  <link rel="stylesheet" crossorigin href="./assets/main-Cwztbjak.css">
</head>
<body>
  <div id="boot" aria-live="polite"><i></i>Раскладываем планшет</div>
  <div id="hero">
    <img id="ambient" alt="" aria-hidden="true" decoding="async">
    <img id="plate" alt="" decoding="async">
    <div id="ink" aria-hidden="true"></div>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="chips" aria-hidden="true"></div>
  </div>
  <div id="spacer"></div>
